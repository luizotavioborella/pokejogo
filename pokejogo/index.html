<!DOCTYPE html>
<html lang="pt-br" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo Pokemon</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <img src="assets/img/pokejogo.png" alt="" class="pokejogo" width="350px">

    <div id="jogo">
        <div id="telaInicio">
            <img src="assets/img/pokejogo.png" alt="" width="350px">
            <button id="btnComecar">Start</button>
        </div>
        <div class="infos">
            
            <h2 class="pontos">Score: <span id="pontos">0</span> </h2>
            <h2 class="recorde">Record: <span id="record">0</span></h2>
            <div class="vidas">
                <img id="vida1" src="assets/img/pokebola.png">
                <img id="vida2" src="assets/img/pokebola.png">
                <img id="vida3" src="assets/img/pokebola.png">
            </div>

        </div>
        <div id="personagem"></div>
        <div id="vilao"></div>
        <div id="telaGameOver">
            <h2>Game Over</h2>
            <p>Score: <span id="pontosGameOver">0</span></p>
            <button id="btnReiniciar">Play again</button>
        </div>
    </div>
    <audio id="musica" src="assets/audio/musica.mp3" loop preload="auto"></audio>
    <audio id="somDano" src="assets/audio/dano.mp3" preload="auto"></audio>
    <audio id="somPulo" src="assets/audio/pulo.mp3" preload="auto"></audio>
    <script src="assets/js/jogo.js" defer></script>
</body>
</html>
